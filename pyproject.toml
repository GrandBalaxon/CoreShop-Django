[project]
name = "coreshop-django"
version = "0.1.0"
description = ""
authors = [
    {name = "Vlad Spinul",email = "shinokakaov@mail.ru"}
]
requires-python = ">=3.14"
dependencies = [
    "django (>=6.0.4,<7.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pillow (>=12.2.0,<13.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "black (>=26.3.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "mypy (>=1.20.2,<2.0.0)"
]
dev = [
    "ipython (>=9.13.0,<10.0.0)"
]

[tool.black]
line-length = 119
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
  | foo.py
)
'''

[tool.isort]
profile = "black"
line_length = 119

[tool.mypy]
strict = true
warn_unreachable = true
exclude = 'venv'
