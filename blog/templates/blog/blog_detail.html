{% extends 'base.html' %}

{% block content %}
<div class="position-relative vh-100 d-flex flex-column text-white"
     style="background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('{{ blogpost.preview.url }}') no-repeat center center;
     background-size: cover; max-height: 600px;">

    <div class="container flex-grow-1 d-flex flex-column">

        <div class="mt-auto mb-auto text-start">
            <h1 class="display-3 fw-bold">{{ blogpost.title }}</h1>
        </div>

        <div class="d-flex justify-content-start gap-4 mb-5 fw-bold">

            <span class="d-flex align-items-center gap-2">
                <img src="/static/images/calendar3.svg/" alt="" width="20" height="20" style="filter: invert(1);">
                {{ blogpost.created_at | date:"d E Y" }}
            </span>

            <span class="d-flex align-items-center gap-2">
                <img src="/static/images/eye.svg/" alt="" width="20" height="20" style="filter: invert(1);">
                {{ blogpost.views_count }}
            </span>

            <span class="d-flex align-items-center gap-2">
                <img src="/static/images/tags-fill.svg/" alt="" width="20" height="20" style="filter: invert(1);">
                {{ blogpost.category }}
            </span>

        </div>

    </div>
</div>

<div class="container mt-5">

    <div class="text-center mb-5">
        <img src="{{ blogpost.preview.url }}" alt="{{ blogpost.title }}" class="img-fluid rounded">
    </div>

    <article class="article-content mb-4 fs-5 text-start m-3 flex-grow-1">
        {{ blogpost.content | linebreaks }}
    </article>

    <div class="d-flex mt-4 mb-4 align-items-center gap-2">
    {% if not blogpost.is_published %}
    <form method="post">
        {% csrf_token %}
        <div class="container text-center">
            <button type="submit" class="btn btn-lg btn-primary">Опубликовать</button>
        </div>
    </form>
    {% endif %}
    <div>
        <a class="btn btn-lg btn-outline-secondary" href="/blog/post/{{ blogpost.pk }}/edit/">Редактировать</a>
    </div>

</div>

</div>
{% endblock %}
