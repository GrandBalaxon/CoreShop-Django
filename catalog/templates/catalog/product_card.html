<div class="col-12 col-md-6 col-lg-4 mb-4">
            <div class="card box-shadow shadow-sm h-100 position-relative overflow-hidden">

                <div class="card-body d-flex flex-column p-4">

                    {% if product.image %}
                        <div class="position-absolute" style="top: 0.2rem; right: 0.2rem; opacity: 0.15; z-index: 0;">
                            <img src="{{ product.image.url }}"
                                 alt=""
                                 style="width: 120px; height: 120px; object-fit: contain;">
                        </div>
                    {% endif %}

                    <div style="z-index: 1;">
                        <span class="badge bg-light text-primary mb-2 fw-normal">{{ product.category }}</span>
                        <h5 class="card-title fw-bold mb-3" style="min-height: 3rem;">{{ product.name }}</h5>
                        <p class="card-text text-muted mb-4 flex-grow-1">{{ product.description | truncatechars:100 }}</p>
                    </div>

                    <div class="mt-auto pt-3 border-top">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <span class="text-muted small d-block">Цена:</span>
                                <span class="fs-3 fw-bold text-dark">${{ product.price }}</span>
                            </div>
                            <div class="d-flex gap-2">
                                <a href="product/{{ product.id }}/" class="btn btn-light btn-sm d-inline-flex align-items-center justify-content-center" style="width: 38px; height: 38px;">
                                    <img src="/static/images/info-circle.svg" fill="currentColor" alt="Инфо" style="width: 18px; height: 18px;">
                                </a>
                                <a href="#" class="btn btn-primary d-flex align-items-center gap-2">
                                    <svg width="1em" height="1em" fill="currentColor"><use href="/static/images/cart.svg"/></svg>
                                    Купить
                                </a>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
