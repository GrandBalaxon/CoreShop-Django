<div class="d-flex flex-row flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow justify-content-between">

    <div class="d-flex align-items-center">
        <h5 class="my-0 mr-md-auto font-weight-normal">Skystore</h5>
        <nav class="ms-4">
            <a class="p-2 btn btn-outline-primary" href="/">Каталог</a>
            <a class="p-2 btn btn-outline-primary" href="/contacts/">Контакты</a>
            <a class="p-2 btn btn-outline-primary" href="/blog/">Блог</a>
        </nav>
    </div>

    {% if user.is_authenticated %}
    <div class="d-flex align-items-center gap-2">
        {% if request.path == '/' %}
        <a class="p-2 mr-4 btn btn-primary d-inline-flex align-items-center" href="/product/add/">
            <svg class="bi" width="1em" height="1em" fill="currentColor">
                <use href="/static/images/plus-circle-fill.svg"/>
            </svg>
            <span class="border-start border-white opacity-50 mx-2" style="height: 1.2em;"></span>
            Добавить товар
        </a>
        {% elif request.path == '/blog/' %}
        <a class="p-2 mr-4 btn btn-primary d-inline-flex align-items-center" href="/blog/post/new/">
            <svg class="bi" width="1em" height="1em" fill="currentColor">
                <use href="/static/images/plus-circle-fill.svg"/>
            </svg>
            <span class="border-start border-white opacity-50 mx-2" style="height: 1.2em;"></span>
            Написать статью
        </a>
        {% endif %}
        <a class="p-2 btn btn-outline-secondary" href="/admin/">
            Admin
        </a>
    </div>
    {% endif %}

</div>
